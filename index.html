<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Paw Pulse LK | Cat & Dog Blood Donation Initiative – Sri Lanka</title>
    <meta name="description" content="Register your healthy cat or dog as a blood donor with Paw Pulse LK. A free, consent-based initiative by Leo Club of Colombo City 306D5 to save pets in urgent medical need across Sri Lanka." />
    <meta name="keywords" content="cat blood donation Sri Lanka, dog blood donation Sri Lanka, pet blood donor, Paw Pulse LK, Leo Club Colombo, animal blood bank" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://pawpulse.lk/" />

    <!-- Open Graph (Facebook / WhatsApp / LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pawpulse.lk/" />
    <meta property="og:title" content="Paw Pulse LK | Cat & Dog Blood Donation Initiative" />
    <meta property="og:description" content="Register your healthy cat or dog as a blood donor. Free, safe, and consent-based. Initiated by Leo Club of Colombo City 306D5." />
    <meta property="og:image" content="https://pawpulse.lk/og-image.png" />
    <meta property="og:locale" content="en_LK" />
    <meta property="og:site_name" content="Paw Pulse LK" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Paw Pulse LK | Cat & Dog Blood Donation Initiative" />
    <meta name="twitter:description" content="Register your healthy cat or dog as a blood donor. Free, safe, and consent-based. Initiated by Leo Club of Colombo City 306D5." />
    <meta name="twitter:image" content="https://pawpulse.lk/og-image.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "NGO",
      "name": "Paw Pulse LK",
      "description": "A cat and dog blood donation initiative by Leo Club of Colombo City 306D5, building a trusted donor network to save pets in urgent medical need.",
      "url": "https://pawpulse.lk/",
      "logo": "https://pawpulse.lk/favicon.svg",
      "foundingOrganization": {
        "@type": "Organization",
        "name": "Leo Club of Colombo City 306D5"
      },
      "areaServed": {
        "@type": "Country",
        "name": "Sri Lanka"
      },
      "sameAs": []
    }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts: load non-blocking via print media trick, swap to all once loaded -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
